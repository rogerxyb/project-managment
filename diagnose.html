<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据库诊断工具</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .section {
            margin-bottom: 25px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }
        .section h2 {
            margin-top: 0;
            font-size: 1.2em;
        }
        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            margin: 5px 0;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
        }
        .status-item.success {
            background: rgba(76, 175, 80, 0.3);
        }
        .status-item.error {
            background: rgba(244, 67, 54, 0.3);
        }
        .data-item {
            background: rgba(255, 255, 255, 0.15);
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #4ade80;
        }
        .data-content {
            font-size: 1.1em;
            margin-bottom: 8px;
            word-wrap: break-word;
        }
        .data-meta {
            font-size: 0.85em;
            opacity: 0.7;
        }
        button {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            border-radius: 25px;
            color: white;
            font-size: 1em;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: white;
            color: #667eea;
        }
        pre {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 数据库诊断工具</h1>
        
        <div class="section">
            <h2>📊 诊断状态</h2>
            <div id="statusList">
                <div class="status-item" id="connStatus">🔄 检查连接...</div>
                <div class="status-item" id="authStatus">🔄 检查认证...</div>
                <div class="status-item" id="dbStatus">🔄 检查数据库...</div>
                <div class="status-item" id="permStatus">🔄 检查权限...</div>
            </div>
        </div>
        
        <div class="section">
            <h2>💾 数据库中的消息</h2>
            <button onclick="refreshData()">🔄 刷新数据</button>
            <button onclick="testInsert()">➕ 测试插入</button>
            <button onclick="clearTestData()">🗑️ 清理测试</button>
            <div id="dataList" style="margin-top: 15px;">
                <p>点击"刷新数据"查看数据库内容</p>
            </div>
        </div>
        
        <div class="section">
            <h2>📝 测试结果</h2>
            <pre id="testResult">等待测试...</pre>
        </div>
    </div>

    <script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
    <script>
        const app = cloudbase.init({
            env: "roger-ai-test-d1griv544b69ece6b",
            region: "ap-shanghai"
        });
        
        const db = app.database();
        
        function log(message, type = 'info') {
            const result = document.getElementById('testResult');
            const timestamp = new Date().toLocaleTimeString();
            const prefix = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
            result.innerHTML += `[${timestamp}] ${prefix} ${message}\n`;
            result.scrollTop = result.scrollHeight;
        }
        
        function updateStatus(id, message, isSuccess) {
            const el = document.getElementById(id);
            el.textContent = message;
            el.className = 'status-item ' + (isSuccess ? 'success' : 'error');
        }
        
        async function runDiagnostics() {
            log('开始诊断...\n');
            
            // 1. 测试连接
            log('1. 测试数据库连接...');
            try {
                const result = await db.collection('messages').count();
                updateStatus('connStatus', '✅ 数据库连接成功', true);
                log('数据库连接正常', 'success');
            } catch (error) {
                updateStatus('connStatus', '❌ 连接失败: ' + error.message, false);
                log('连接失败: ' + error.message, 'error');
                return;
            }
            
            // 2. 测试认证
            log('\n2. 测试用户认证...');
            try {
                const authState = await app.auth().getAuthState();
                if (authState) {
                    updateStatus('authStatus', `✅ 已登录 (${authState.uid || '匿名'})`, true);
                    log('用户已认证', 'success');
                } else {
                    log('未登录，开始匿名登录...');
                    await app.auth().signInAnonymously();
                    const newState = await app.auth().getAuthState();
                    updateStatus('authStatus', `✅ 匿名登录成功 (${newState.uid})`, true);
                    log('匿名登录成功', 'success');
                }
            } catch (error) {
                updateStatus('authStatus', '❌ 认证失败: ' + error.message, false);
                log('认证失败: ' + error.message, 'error');
            }
            
            // 3. 测试查询
            log('\n3. 测试数据查询...');
            try {
                const result = await db.collection('messages')
                    .orderBy('createdAt', 'desc')
                    .limit(20)
                    .get();
                updateStatus('dbStatus', `✅ 查询成功 (${result.data.length} 条记录)`, true);
                log(`查询到 ${result.data.length} 条消息`, 'success');
            } catch (error) {
                updateStatus('dbStatus', '❌ 查询失败: ' + error.message, false);
                log('查询失败: ' + error.message, 'error');
            }
            
            // 4. 检查权限
            log('\n4. 检查数据库权限...');
            log('请检查CloudBase控制台中 messages 集合的权限设置');
            log('建议: 设置为 "仅创建者及管理员可读写" 或 "所有用户可读，仅创建者可写"');
            updateStatus('permStatus', '⚠️ 请检查控制台权限设置', false);
            
            log('\n诊断完成！如果数据不显示，请检查：');
            log('1. 数据库集合权限设置');
            log('2. 浏览器控制台错误信息');
            log('3. CloudBase环境是否正常');
        }
        
        async function refreshData() {
            const dataList = document.getElementById('dataList');
            dataList.innerHTML = '<p>🔄 正在加载...</p>';
            
            try {
                const result = await db.collection('messages')
                    .orderBy('createdAt', 'desc')
                    .limit(50)
                    .get();
                
                if (result.data.length === 0) {
                    dataList.innerHTML = '<p>数据库中没有消息</p>';
                    return;
                }
                
                let html = '';
                result.data.forEach((msg, index) => {
                    const time = new Date(msg.createdAt).toLocaleString('zh-CN');
                    html += `
                        <div class="data-item">
                            <div class="data-content">${escapeHtml(msg.content)}</div>
                            <div class="data-meta">
                                <strong>ID:</strong> ${msg._id} | 
                                <strong>时间:</strong> ${time}
                            </div>
                        </div>
                    `;
                });
                
                dataList.innerHTML = `<p><strong>共 ${result.data.length} 条消息:</strong></p>` + html;
                log(`刷新成功: ${result.data.length} 条消息`, 'success');
            } catch (error) {
                dataList.innerHTML = `<p style="color: #f87171;">加载失败: ${error.message}</p>`;
                log('刷新失败: ' + error.message, 'error');
            }
        }
        
        async function testInsert() {
            log('\n开始测试插入...');
            try {
                const testMsg = '诊断测试消息 - ' + new Date().toLocaleString('zh-CN');
                const result = await db.collection('messages').add({
                    content: testMsg,
                    createdAt: new Date(),
                    isTest: true
                });
                log(`插入成功! 文档ID: ${result._id}`, 'success');
                await refreshData();
            } catch (error) {
                log('插入失败: ' + error.message, 'error');
            }
        }
        
        async function clearTestData() {
            log('\n清理测试数据...');
            try {
                const result = await db.collection('messages')
                    .where({ isTest: true })
                    .remove();
                log(`清理成功: 删除 ${result.deleted} 条测试数据`, 'success');
                await refreshData();
            } catch (error) {
                log('清理失败: ' + error.message, 'error');
            }
        }
        
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // 启动诊断
        runDiagnostics();
        refreshData();
    </script>
</body>
</html>
