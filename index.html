<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>欢迎使用云开发静态网站托管</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, "Helvetica Neue", sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }
        
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        h1 {
            font-size: 1.8em;
            margin: 0;
            text-align: center;
            flex: 1;
            min-width: 200px;
        }
        
        .refresh-btn {
            padding: 10px 20px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        
        .refresh-btn:active {
            transform: scale(0.95);
        }
        
        .status {
            text-align: center;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 12px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .status.success {
            background: rgba(76, 175, 80, 0.3);
        }
        
        .status.error {
            background: rgba(244, 67, 54, 0.3);
        }
        
        .input-section {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        input[type="text"] {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            background: white;
            color: #333;
            min-height: 48px;
        }
        
        input[type="text"]::placeholder {
            color: #999;
        }
        
        button {
            padding: 14px 28px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            border-radius: 25px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 48px;
            min-width: 80px;
            white-space: nowrap;
        }
        
        button:active {
            transform: scale(0.95);
            background: white;
            color: #667eea;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .message-count {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 12px;
            padding: 0 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .message-list {
            background: rgba(255, 255, 255, 0.1);
            padding: 16px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .message-item {
            background: rgba(255, 255, 255, 0.15);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            text-align: left;
            animation: fadeIn 0.3s ease-in;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        
        .message-item:last-child {
            margin-bottom: 0;
        }
        
        .message-text {
            font-size: 16px;
            margin-bottom: 8px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        
        .message-time {
            font-size: 12px;
            opacity: 0.7;
        }
        
        .empty-state {
            text-align: center;
            opacity: 0.7;
            padding: 40px 20px;
            font-size: 15px;
        }
        
        .last-update {
            font-size: 12px;
            opacity: 0.6;
        }
        
        /* 响应式设计 - 平板 */
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            
            h1 {
                font-size: 1.5em;
            }
            
            .input-section {
                padding: 16px;
            }
            
            .input-group {
                flex-direction: column;
                gap: 10px;
            }
            
            input[type="text"] {
                width: 100%;
            }
            
            button {
                width: 100%;
            }
            
            .message-item {
                padding: 14px;
            }
            
            .message-text {
                font-size: 15px;
            }
        }
        
        /* 响应式设计 - 手机 */
        @media (max-width: 480px) {
            body {
                padding: 12px;
            }
            
            .header-actions {
                margin-bottom: 15px;
            }
            
            h1 {
                font-size: 1.3em;
                min-width: auto;
            }
            
            .refresh-btn {
                padding: 8px 16px;
                font-size: 13px;
            }
            
            .status {
                padding: 10px;
                font-size: 13px;
                margin-bottom: 15px;
            }
            
            .input-section {
                padding: 14px;
                margin-bottom: 15px;
            }
            
            input[type="text"] {
                padding: 12px 16px;
                font-size: 16px;
                border-radius: 12px;
            }
            
            button {
                padding: 12px 20px;
                font-size: 15px;
                border-radius: 12px;
            }
            
            .message-count {
                font-size: 13px;
                margin-bottom: 10px;
            }
            
            .message-list {
                padding: 12px;
            }
            
            .message-item {
                padding: 12px;
                margin-bottom: 10px;
                border-radius: 10px;
            }
            
            .message-text {
                font-size: 15px;
                line-height: 1.4;
            }
            
            .message-time {
                font-size: 11px;
            }
            
            .empty-state {
                padding: 30px 15px;
                font-size: 14px;
            }
        }
        
        /* 大屏幕优化 */
        @media (min-width: 1200px) {
            .container {
                max-width: 900px;
            }
            
            h1 {
                font-size: 2.2em;
            }
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* 触摸优化 */
        @media (hover: none) and (pointer: coarse) {
            button:hover {
                background: rgba(255, 255, 255, 0.2);
                color: white;
            }
            
            button:active {
                background: white;
                color: #667eea;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-actions">
            <h1>🎉 欢迎使用云开发</h1>
            <button class="refresh-btn" onclick="forceRefresh()">🔄 刷新</button>
        </div>
        
        <div id="status" class="status" style="background: rgba(255, 255, 255, 0.1);">正在连接云数据库...</div>
        
        <div class="input-section">
            <div class="input-group">
                <input type="text" id="messageInput" placeholder="输入您的消息..." />
                <button id="submitBtn" onclick="submitMessage()">发送</button>
            </div>
        </div>
        
        <div class="message-count">
            <span id="messageCount">加载中...</span>
            <span class="last-update" id="lastUpdate"></span>
        </div>
        <div class="message-list" id="messageList">
            <div class="empty-state" id="emptyState">暂无消息，提交第一条消息吧！</div>
        </div>
    </div>

    <!-- CloudBase SDK -->
    <script src="https://static.cloudbase.net/cloudbase-js-sdk/latest/cloudbase.full.js"></script>
    
    <script>
        // 初始化 CloudBase
        const app = cloudbase.init({
            env: "roger-ai-test-d1griv544b69ece6b",
            region: "ap-shanghai"
        });

        const db = app.database();
        let isSubmitting = false;
        let refreshInterval = null;
        let lastDocId = null;
        let totalMessages = 0;
        const REFRESH_INTERVAL = 1000; // 每1秒刷新（更快）
        const MAX_MESSAGES = 100;

        // 初始化函数
        async function init() {
            try {
                await app.auth().signInAnonymously();
                updateStatus('已连接，正在加载数据...', '');
                await loadMessages();
                startAutoRefresh();
            } catch (error) {
                console.error('初始化失败:', error);
                updateStatus('连接失败: ' + error.message, 'error');
            }
        }

        // 启动自动刷新
        function startAutoRefresh() {
            if (refreshInterval) return;
            refreshInterval = setInterval(async () => {
                await loadMessages();
            }, REFRESH_INTERVAL);
            console.log('自动刷新已启动，每', REFRESH_INTERVAL/1000, '秒刷新一次');
        }

        // 停止自动刷新
        function stopAutoRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
        }

        // 强制刷新
        async function forceRefresh() {
            updateStatus('正在刷新...', '');
            await loadMessages();
            updateStatus('数据已刷新 (' + new Date().toLocaleTimeString() + ')', 'success');
        }

        // 更新状态显示
        function updateStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            if (type === 'success') {
                status.style.background = 'rgba(76, 175, 80, 0.3)';
            } else if (type === 'error') {
                status.style.background = 'rgba(244, 67, 54, 0.3)';
            } else {
                status.style.background = 'rgba(255, 255, 255, 0.1)';
            }
        }

        // 加载消息列表
        async function loadMessages() {
            try {
                const result = await db.collection('messages')
                    .orderBy('createdAt', 'desc')
                    .limit(MAX_MESSAGES)
                    .get();
                
                const messages = result.data;
                const messageList = document.getElementById('messageList');
                const messageCount = document.getElementById('messageCount');
                const lastUpdate = document.getElementById('lastUpdate');
                
                // 更新最后更新时间
                const now = new Date();
                lastUpdate.textContent = '最后更新: ' + now.toLocaleTimeString();
                
                // 检查消息数量变化
                if (totalMessages !== messages.length) {
                    totalMessages = messages.length;
                    messageCount.textContent = `共 ${messages.length} 条消息`;
                    
                    // 如果有新消息，显示提示
                    if (messages.length > 0 && lastDocId && messages[0]._id !== lastDocId) {
                        updateStatus('✨ 检测到新消息！', 'success');
                        setTimeout(() => {
                            updateStatus('已连接，数据实时同步中', 'success');
                        }, 2000);
                    }
                }
                
                if (messages.length === 0) {
                    messageList.innerHTML = '<div class="empty-state">暂无消息，提交第一条消息吧！</div>';
                    return;
                }

                const latestDocId = messages[0]._id;
                
                // 如果是首次加载或文档ID变化，更新显示
                if (!lastDocId || latestDocId !== lastDocId) {
                    lastDocId = latestDocId;

                    let html = '';
                    messages.forEach((msg, index) => {
                        const time = new Date(msg.createdAt).toLocaleString('zh-CN');
                        html += `
                            <div class="message-item">
                                <div class="message-text">${escapeHtml(msg.content)}</div>
                                <div class="message-time">${time}</div>
                            </div>
                        `;
                    });
                    messageList.innerHTML = html;
                }
                
            } catch (error) {
                console.error('加载失败:', error);
                // 不显示错误，避免干扰用户
            }
        }

        // 提交消息
        async function submitMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) {
                alert('请输入消息内容');
                return;
            }

            if (isSubmitting) return;
            
            isSubmitting = true;
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '发送中...';
            
            try {
                const result = await db.collection('messages').add({
                    content: message,
                    createdAt: new Date()
                });
                
                console.log('消息已存储:', result._id);
                input.value = '';
                updateStatus('✅ 消息已发送！', 'success');
                
                // 立即刷新数据
                await loadMessages();
                
                // 2秒后恢复状态
                setTimeout(() => {
                    updateStatus('已连接，数据实时同步中', 'success');
                }, 2000);
                
            } catch (error) {
                console.error('提交失败:', error);
                updateStatus('提交失败: ' + error.message, 'error');
                alert('提交失败: ' + error.message);
            } finally {
                isSubmitting = false;
                submitBtn.disabled = false;
                submitBtn.textContent = '发送';
            }
        }

        // HTML转义防止XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 回车提交
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                submitMessage();
            }
        });

        // 页面关闭时清理
        window.addEventListener('beforeunload', function() {
            stopAutoRefresh();
        });

        // 页面可见性变化时控制刷新
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible') {
                loadMessages();
                if (!refreshInterval) {
                    startAutoRefresh();
                }
            } else {
                stopAutoRefresh();
            }
        });

        // 启动应用
        init();
    </script>
</body>
</html>
